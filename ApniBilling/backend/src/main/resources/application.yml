server:
  port: 8080

spring:
  application:
    name: apnibilling-backend

  datasource:
    # Defaults to in-memory H2 with PostgreSQL syntax compatibility for zero-setup local run,
    # or override with SPRING_DATASOURCE_URL for real PostgreSQL
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:apnibilling;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false # Enabled when targeting external PostgreSQL

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.apnibilling: DEBUG
